<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24493a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>얼굴 과외쌤</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/stage.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/dialogs.css">
<link rel="stylesheet" href="css/pdf.css">
</head>
<body>

<!-- 위쪽 버튼 -->
<div class="topbar">
  <button class="btn-top" id="btnNote" type="button"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h6"/></svg><span>오답노트</span></button>
  <button class="btn-top" id="btnFull" type="button" aria-label="전체화면" hidden><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="btn-top" id="btnSet" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg><span>설정</span></button>
</div>

<!-- 캐릭터: 오려 붙인 얼굴 + 몸 -->
<div class="tutor" id="tutor"><div class="tutor-in">
  <button class="empty-head" id="emptyHead" type="button">얼굴<small>눌러서 사진을 오려 붙이세요</small></button>
  <div class="head hide" id="head"><canvas id="faceCv" aria-label="선생님 얼굴"></canvas></div>
  <div class="body">
    <svg viewBox="0 0 400 150" aria-hidden="true">
      <path d="M150 0 Q150 38 135 52 L200 78 L265 52 Q250 38 250 0 Z" fill="#e9b996" id="neck"/>
      <path d="M20 150 Q26 78 112 56 L150 44 Q200 96 250 44 L288 56 Q374 78 380 150 Z" fill="var(--shirt)"/>
      <path d="M150 44 Q200 96 250 44 L262 56 Q200 112 138 56 Z" fill="#cfd6e4"/>
    </svg>
  </div>
</div></div>

<button class="big-btn cta" id="btnProb" type="button">문제 올리기</button>

<!-- 질문 창 (질문 모드에서만 보임) -->
<section class="dock" id="dock" aria-label="질문">
  <div class="qa">
    <div class="qa-head"><b>이 문제에서 궁금한 점</b><button class="btn" id="btnEnd" type="button">끝내기</button></div>
    <details class="prob-card" id="probCard" open><summary>문제 보기</summary><div id="probBody"></div></details>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="save-bar hide" id="saveBar"></div>
    <form class="ask" id="askForm">
      <input type="text" id="askText" placeholder="궁금한 점을 물어보세요" aria-label="질문" autocomplete="off">
      <button class="btn pri" id="askSend">질문</button>
    </form>
  </div>
</section>

<!-- 문제 올리기 서랍 -->
<aside class="drawer closed" id="drawer" inert>
  <div class="row-between"><h2>문제 올리기</h2><button class="btn" id="closeDrawer" type="button">닫기</button></div>
  <div class="drop" id="drop" tabindex="0" role="button">문제 사진 올리기 / 붙여넣기(Ctrl+V)</div>
  <div class="row"><button class="btn" id="pickPhoto" type="button">앨범에서 고르기</button><button class="btn" id="camPhoto" type="button">카메라로 찍기</button></div>
  <div id="probPrev" class="hide">
    <canvas id="probCv" aria-label="문제 사진 미리보기. 끌어서 문제 부분만 선택"></canvas>
    <div class="row mt"><button class="btn" id="resetCrop" type="button">자동 맞춤</button><button class="btn" id="fullCrop" type="button">전체 사용</button><span class="note" id="probInfo"></span></div>
    <div class="note">사진 위를 끌어서 문제 부분만 고르면 토큰이 줄어요.</div>
    <label class="note"><input type="checkbox" id="rmColor" checked> 오답노트 그림에서 색 펜 손글씨 지우기</label>
  </div>
  <input type="file" id="probFile" accept="image/*" class="hide">
  <input type="file" id="probCam" accept="image/*" capture="environment" class="hide">
  <textarea id="probText" aria-label="문제 글" placeholder="문제를 글로 적어도 돼요. (사진만 올려도 OK)"></textarea>
  <button class="big-btn go" id="go" type="button">질문하러 가기</button>
  <div class="err" id="err" role="alert"></div>
</aside>

<!-- 오답노트 -->
<dialog id="noteDlg" class="wide">
  <div class="row-between"><h2>오답노트</h2><button class="btn" id="noteClose" type="button">닫기</button></div>
  <div class="tabs" id="noteTabs"></div>
  <div class="note-list" id="noteList"></div>
  <div class="export-bar">
    <select id="pdfScope" aria-label="범위"><option value="cat">이 분류만</option><option value="all">전체 섞어서</option></select>
    <button class="btn pri" id="pdfExam" type="button">모의고사 PDF</button>
    <button class="btn" id="pdfNote" type="button">오답노트 PDF</button>
  </div>
  <div class="note" id="pdfMsg" role="status"></div>
</dialog>

<!-- 그림 지우개 -->
<dialog id="figDlg">
  <h2>그림 다듬기</h2><p class="note">손으로 쓴 글씨나 낙서 위를 문질러서 지워요.</p>
  <canvas id="figCv"></canvas>
  <label class="note" for="brush">지우개 크기</label><input type="range" id="brush" min="4" max="60" value="18">
  <div class="row end mt"><button class="btn" id="figReset" type="button">원래대로</button><button class="btn" id="figCancel" type="button">취소</button><button class="btn pri" id="figDone" type="button">완료</button></div>
</dialog>

<!-- 설정 -->
<dialog id="setDlg">
  <div class="row-between"><h2>설정</h2><button class="btn" id="setClose" type="button">닫기</button></div>
  <div class="set-list">
    <label class="field">Anthropic API 키
      <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
      <span class="note">이 기기의 브라우저에만 저장돼요. 다른 곳으로 보내지 않아요.</span>
    </label>
    <label class="field">모델
      <select id="model">
        <option value="claude-haiku-5-5">하이쿠 (빠르고 저렴)</option>
        <option value="claude-sonnet-5-5">소네트 (더 정확)</option>
      </select>
    </label>
    <div class="row">
      <select id="level" aria-label="학년">
        <option value="초등학생">초등</option><option value="중학생">중등</option><option value="고등학생">고등</option><option value="대학생·성인">대학/성인</option>
      </select>
      <select id="style" aria-label="말투">
        <option value="다정하고 친근한 반말 선생님">다정한 반말</option>
        <option value="차분한 존댓말 선생님">차분한 존댓말</option>
        <option value="활기차고 유머러스한 선생님">텐션 높게</option>
      </select>
    </div>
    <button class="btn" id="btnFace" type="button">얼굴 편집</button>
  </div>
</dialog>

<!-- 얼굴 편집 -->
<dialog id="faceDlg">
  <div class="row-between"><h2>얼굴 오려 붙이기</h2><button class="btn" id="cropBig" type="button">크게 보기</button></div>
  <p class="note help">사진을 올리고 점을 끌어 얼굴 윤곽을 따라 그려요(선을 누르면 점 추가, 두 번 누르면 삭제). "사진 이동·확대·회전" 탭에서는 끌어서 옮기고, 모서리 동그라미를 끌거나 두 손가락으로 모아 벌려 크기와 각도를 바꿔요.</p>
  <div class="row mt"><button class="btn pri" id="facePick" type="button">앨범에서 고르기</button><button class="btn" id="faceCam" type="button">셀카 찍기</button></div>
  <div class="note" id="faceMsg" role="status"></div>
  <input type="file" id="faceFile" accept="image/*" class="hide">
  <input type="file" id="faceSelfie" accept="image/*" capture="user" class="hide">
  <div class="tabs mt">
    <button type="button" id="tabShape" class="on">윤곽 편집</button>
    <button type="button" id="tabMove">사진 이동·확대·회전</button>
    <button type="button" id="resetOutline">윤곽 초기화(자동)</button>
  </div>
  <div class="cropwrap" id="cw"><canvas id="cv" width="800" height="900"></canvas></div>
  <div class="sliders">
    <div><label class="note" for="zoom">확대·축소</label><input type="range" id="zoom" min="0.1" max="5" step="0.01" value="1"></div>
    <div><label class="note" for="rot">회전</label><input type="range" id="rot" min="-180" max="180" step="1" value="0"></div>
  </div>
  <div class="row end mt"><button class="btn" id="faceCancel" type="button">취소</button><button class="btn pri" id="faceSave" type="button">붙이기</button></div>
</dialog>

<script src="vendor/katex/katex.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
