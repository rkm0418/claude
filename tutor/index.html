<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>얼굴 과외쌤</title>
<style>
@font-face{font-family:"Gmarket";src:url(fonts/GmarketSansTTFLight.ttf);font-weight:300}
@font-face{font-family:"Gmarket";src:url(fonts/GmarketSansTTFMedium.ttf);font-weight:500}
@font-face{font-family:"Gmarket";src:url(fonts/GmarketSansTTFBold.ttf);font-weight:700}
@font-face{font-family:"LevelUp";src:url(fonts/LevelUp-Regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:"LevelUp";src:url(fonts/LevelUp-Bold.woff2) format("woff2");font-weight:700}
@font-face{font-family:"Freesentation";src:url(fonts/Freesentation-4Regular.ttf);font-weight:400}
@font-face{font-family:"Freesentation";src:url(fonts/Freesentation-6SemiBold.ttf);font-weight:600}
@font-face{font-family:"Freesentation";src:url(fonts/Freesentation-8ExtraBold.ttf);font-weight:800}

:root{
  --g1:#3b6b57; --g2:#24493a; --ink:#1f2a26; --mute:#6f7f77; --card:#ffffff; --soft:#eef2ef;
  --coral:#ef6a62; --coral2:#d9564e; --ok:#2f9e6f; --shirt:#e9edf5; --r:20px;
  --sh:0 10px 30px rgba(10,35,25,.28);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 90% at 50% 0%,var(--g1),var(--g2));background-attachment:fixed;color:var(--ink);font-family:"Freesentation",sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:"Gmarket",sans-serif;font-weight:700;margin:0}
.app{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(340px,.8fr);gap:24px;min-height:100dvh;padding:20px}
@media(max-width:860px){.app{grid-template-columns:1fr;padding:12px}}

.stage{position:relative;overflow:hidden;min-height:calc(100dvh - 40px)}
.topbar{position:absolute;left:8px;right:8px;top:8px;z-index:7;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:"Gmarket";font-weight:700;font-size:15px;color:#ffffffb0}
.iconbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:#fff;color:var(--ink);border-radius:16px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.iconbtn svg{width:18px;height:18px}
.iconbtn:active{transform:scale(.95)}
.hero{text-align:center;color:#fff;margin:6px 0 0}
.hero .big{font-family:"Gmarket";font-weight:700;font-size:clamp(34px,6.4vw,76px);letter-spacing:-.03em;line-height:1.05;text-shadow:0 6px 14px rgba(0,0,0,.28);word-break:keep-all}
.hero .sub{font-family:"Gmarket";font-weight:500;font-size:15px;color:#ffffffc0;margin-top:8px}

.tutor{position:absolute;left:50%;top:50%;width:min(52vh,460px);min-width:220px;transform:translate(-50%,-50%);transform-origin:50% 100%}
.tutor::after{content:"";position:absolute;left:-8%;right:-8%;bottom:-14px;height:34px;background:radial-gradient(closest-side,rgba(0,0,0,.35),transparent);z-index:0}
.tutor-in{transform-origin:50% 100%}.tutor.talking .tutor-in{animation:bob .42s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-.6deg)}to{transform:translateY(-6px) rotate(.6deg)}}
.tutor.think .head{animation:tilt 1.2s ease-in-out infinite alternate}
@keyframes tilt{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.head{position:relative;width:100%;aspect-ratio:var(--ar,6/7);transform-origin:50% 95%;z-index:2;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.head img{position:absolute;inset:0;width:100%;height:100%;display:block}
.mouth{position:absolute;width:15%;height:3%;left:50%;top:70%;transform:translate(-50%,-50%);background:#3a1414;border-radius:50%;opacity:0;transition:opacity .12s}
.tutor.talking .mouth{opacity:.92}
.mouth.m1{height:5%}.mouth.m2{height:9%}.mouth.m3{height:13%}
.body{position:relative;margin-top:-10%;z-index:1;width:104%;margin-left:-2%}
.body svg{display:block;width:100%;height:auto}
.empty-head{width:100%;aspect-ratio:6/7;border-radius:18% 18% 50% 50%/14% 14% 60% 60%;display:grid;place-items:center;text-align:center;font-family:"Gmarket";font-weight:700;font-size:clamp(28px,5vw,44px);background:#ffffff22;color:#fff;border:2px dashed #ffffff90;cursor:pointer}
.empty-head small{display:block;font:400 14px "Freesentation";color:#ffffffc0;margin-top:6px}

.bubble{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;width:calc(100% - 24px);max-width:660px;background:var(--card);border-radius:24px;padding:16px 20px 14px;box-shadow:var(--sh)}
.bubble::before{content:"";position:absolute;left:50%;top:-9px;width:20px;height:20px;background:var(--card);transform:translateX(-50%) rotate(45deg);border-radius:4px}
.say{font-family:"LevelUp","Freesentation";font-size:clamp(18px,2.3vw,22px);line-height:1.5;min-height:3em;word-break:keep-all;white-space:pre-wrap}
.ctrls{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.pill{border:0;background:var(--soft);border-radius:14px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:15px}
.pill.pri{background:var(--coral);color:#fff}
.pill:disabled{opacity:.35;cursor:default}
.dots{font-family:"Gmarket";font-size:13px;color:var(--mute)}

.panel{background:var(--card);border-radius:28px;padding:22px 22px 28px;display:flex;flex-direction:column;gap:18px;overflow:auto;max-height:calc(100dvh - 40px);box-shadow:var(--sh)}
@media(max-width:860px){.panel{max-height:none}}
.panel h2{font-size:17px}
.sec{display:flex;flex-direction:column;gap:10px}
textarea{width:100%;min-height:100px;resize:vertical;border:0;border-radius:var(--r);background:var(--soft);padding:12px 14px}
textarea:focus,input:focus,select:focus{outline:3px solid #ef6a6255}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drop{border:2px dashed #c4cfc9;border-radius:var(--r);padding:14px;text-align:center;color:var(--mute);cursor:pointer;font-size:15px}
.drop.has{border-style:solid;border-color:transparent;background:var(--soft);padding:6px}
.drop img{max-width:100%;max-height:200px;border-radius:12px;display:block;margin:auto}
.go{background:var(--coral);color:#fff;border:0;border-radius:var(--r);padding:14px;font-family:"Gmarket";font-weight:700;font-size:18px;cursor:pointer;box-shadow:0 6px 0 var(--coral2)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--coral2)}
.go:disabled{opacity:.55;cursor:wait}
.final{background:#e8f6ef;border-radius:var(--r);padding:12px 14px;display:none}
.final b{font-family:"Gmarket";color:var(--ok)}
.followup{display:none;gap:8px}
.followup input{flex:1;border:0;border-radius:14px;padding:8px 16px;background:var(--soft);min-width:0}
select,input[type=password],input[type=text]{border:0;border-radius:14px;padding:8px 12px;background:var(--soft)}
.note{font-size:13px;color:var(--mute)}
.err{color:var(--coral2);font-size:14px;min-height:1.2em}

dialog{border:0;border-radius:28px;background:var(--card);color:var(--ink);padding:22px;width:min(94vw,460px);box-shadow:var(--sh)}
dialog::backdrop{background:rgba(10,30,22,.6)}
.cropwrap{position:relative;margin:12px auto;width:300px;max-width:100%;aspect-ratio:8/9;touch-action:none;background:repeating-conic-gradient(#0001 0 25%,transparent 0 50%) 0 0/16px 16px;border-radius:12px}
.cropwrap canvas{width:100%;height:100%;display:block;cursor:grab}
.mdot{position:absolute;width:22px;height:12px;border-radius:50%;background:#3a1414;border:2px solid #fff;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 1.5px #000}
.tabs{display:flex;gap:6px;justify-content:center}
.tabs button{border:0;background:var(--soft);border-radius:12px;padding:6px 14px;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--ink);color:#fff}
input[type=range]{width:100%;accent-color:var(--coral)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="app">

  <!-- ═════ 왼쪽: 1:1 과외 장면 ═════ -->
  <main class="stage" id="stage">
    <div class="topbar">
      <span class="brand">얼굴 과외쌤</span>
      <span class="row">
        <button class="iconbtn" id="btnFace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>얼굴 바꾸기</button>
      </span>
    </div>

    <div class="tutor" id="tutor"><div class="tutor-in">
      <div id="emptyHead" class="empty-head">얼굴<small>눌러서 사진을 오려 붙이세요</small></div>
      <div class="head hide" id="head">
        <img id="faceImg" alt="선생님 얼굴">
        <div class="mouth" id="mouth"></div>
      </div>
      <div class="body">
        <svg viewBox="0 0 400 150" aria-hidden="true">
          <path d="M150 0 Q150 38 135 52 L200 78 L265 52 Q250 38 250 0 Z" fill="#e9b996" id="neck"/>
          <path d="M20 150 Q26 78 112 56 L150 44 Q200 96 250 44 L288 56 Q374 78 380 150 Z" fill="var(--shirt)"/>
          <path d="M150 44 Q200 96 250 44 L262 56 Q200 112 138 56 Z" fill="#cfd6e4"/>
        </svg>
      </div>
    </div></div>

    
    <div class="bubble" id="bubble">
      <div class="say" id="say">안녕! 문제를 오른쪽에 올려주면 내가 같이 풀어줄게.</div>
      <div class="ctrls">
        <button class="pill" id="prev" disabled>← 이전</button>
        <button class="pill" id="replay" disabled>다시 보기</button>
        <span class="grow dots" id="dots"></span>
        <button class="pill pri" id="next" disabled>다음 →</button>
      </div>
    </div>
  </main>

  <!-- ═════ 오른쪽: 문제 · 칠판 ═════ -->
  <aside class="panel">
    <section class="sec">
      <h2>1. 문제 올리기</h2>
      <div class="drop" id="drop">문제 사진 올리기 / 붙여넣기(Ctrl+V)</div>
      <input type="file" id="probFile" accept="image/*" class="hide">
      <textarea id="probText" placeholder="문제를 글로 적어도 돼요. (사진만 올려도 OK)"></textarea>
      <div class="row">
        <select id="level" aria-label="학년">
          <option value="초등학생">초등</option><option value="중학생" selected>중등</option><option value="고등학생">고등</option><option value="대학생·성인">대학/성인</option>
        </select>
        <select id="style" aria-label="말투">
          <option value="다정하고 친근한 반말 선생님">다정한 반말</option>
          <option value="차분한 존댓말 선생님">차분한 존댓말</option>
          <option value="활기차고 유머러스한 선생님">텐션 높게</option>
        </select>
      </div>
      <button class="go" id="go">선생님, 풀어주세요!</button>
      <div class="err" id="err"></div>
    </section>

    <section class="sec">
      <h2>2. 정답 · 질문</h2>
      <div class="final" id="final"></div>
      <form class="followup" id="followup">
        <input type="text" id="fuText" placeholder="모르겠는 부분 물어보기 (예: 2번째 줄이 왜 그래요?)">
        <button class="pill pri">질문</button>
      </form>
    </section>

    <details class="sec">
      <summary class="note" style="cursor:pointer">설정 (API 키 · 선생님 이름)</summary>
      <div class="sec" style="margin-top:10px">
        <label class="note">Claude API 키 (이 기기 브라우저에만 저장)</label>
        <input type="password" id="apikey" placeholder="sk-ant-…" autocomplete="off">
        <label class="note">선생님 이름</label>
        <input type="text" id="tname" value="얼굴쌤">
      </div>
    </details>
  </aside>
</div>

<!-- 얼굴 오리기 -->
<dialog id="dlg">
  <h2>얼굴 오려 붙이기</h2>
  <p class="note" style="margin:6px 0 0">사진을 올리고 점을 끌어 얼굴 윤곽을 따라 그려요. 선을 누르면 점이 추가되고, 점을 두 번 누르면 지워져요.</p>
  <input type="file" id="faceFile" accept="image/*" style="margin-top:10px;max-width:100%">
  <div class="tabs" style="margin-top:10px">
    <button type="button" id="tabShape" class="on">윤곽 편집</button>
    <button type="button" id="tabMove">사진 이동·확대</button>
    <button type="button" id="tabMouth">입 위치 찍기</button>
  </div>
  <div class="cropwrap" id="cw"><canvas id="cv" width="800" height="900"></canvas><div class="mdot" id="mdot"></div></div>
  <input type="range" id="zoom" min="0.3" max="4" step="0.01" value="1" aria-label="확대">
  <div class="row" style="justify-content:flex-end;margin-top:12px">
    <button class="pill" id="cancel" type="button">취소</button>
    <button class="pill pri" id="save" type="button">붙이기 </button>
  </div>
</dialog>

<script>
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get(k, d=""){ try{ return localStorage.getItem(k) ?? d }catch{ return d } },
  set(k, v){ try{ localStorage.setItem(k, v) }catch{} }
};

/* ═════ 얼굴 오리기 (점을 끌어 윤곽 편집) ═════ */
const FW = 800, FH = 900;
const cv = $("cv"), cx = cv.getContext("2d");
let src = null, view = {x:0,y:0,s:1}, base = 1, mouth = {x:.5,y:.7}, mode = "shape", pts = [];
function defaultPts(){ // 둥근 머리 모양 24점
  const o=[]; for(let i=0;i<20;i++){ const t=i/20*Math.PI*2-Math.PI/2; const r=Math.sin(t)>0?1:1; o.push({x:FW/2+Math.cos(t)*FW*.34, y:FH*.47+Math.sin(t)*FH*(Math.sin(t)>0?.38:.34)}) } return o;
}
function bez(P){ // 닫힌 Catmull-Rom → 베지어 구간 목록
  const n=P.length, seg=[];
  for(let i=0;i<n;i++){ const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    seg.push([p1,{x:p1.x+(p2.x-p0.x)/6,y:p1.y+(p2.y-p0.y)/6},{x:p2.x-(p3.x-p1.x)/6,y:p2.y-(p3.y-p1.y)/6},p2]) }
  return seg;
}
function tracePath(c){ const seg=bez(pts); c.beginPath(); c.moveTo(seg[0][0].x,seg[0][0].y); seg.forEach(s=>c.bezierCurveTo(s[1].x,s[1].y,s[2].x,s[2].y,s[3].x,s[3].y)); c.closePath() }
function samples(){ const out=[]; bez(pts).forEach((s,i)=>{ for(let k=0;k<12;k++){ const t=k/12,u=1-t;
  out.push({i, x:u*u*u*s[0].x+3*u*u*t*s[1].x+3*u*t*t*s[2].x+t*t*t*s[3].x, y:u*u*u*s[0].y+3*u*u*t*s[1].y+3*u*t*t*s[2].y+t*t*t*s[3].y}) } }); return out }
function drawCrop(){
  cx.clearRect(0,0,FW,FH);
  cx.fillStyle="#22223a"; cx.fillRect(0,0,FW,FH);
  if(src){ const sc=base*view.s; cx.drawImage(src, view.x-src.width*sc/2+FW/2, view.y-src.height*sc/2+FH/2, src.width*sc, src.height*sc) }
  cx.save(); cx.fillStyle="rgba(10,10,25,.6)"; const pp=new Path2D(); pp.rect(0,0,FW,FH); const sg=bez(pts); pp.moveTo(sg[0][0].x,sg[0][0].y); sg.forEach(q=>pp.bezierCurveTo(q[1].x,q[1].y,q[2].x,q[2].y,q[3].x,q[3].y)); pp.closePath(); cx.fill(pp,"evenodd"); cx.restore();
  tracePath(cx); cx.lineWidth=4; cx.strokeStyle="#e060e0"; cx.stroke();
  if(mode==="shape"){ pts.forEach(p=>{ cx.beginPath(); cx.arc(p.x,p.y,9,0,7); cx.fillStyle="#fff"; cx.fill(); cx.lineWidth=3; cx.strokeStyle="#e060e0"; cx.stroke() }) }
  $("mdot").style.left = mouth.x/FW*100+"%"; $("mdot").style.top = mouth.y/FH*100+"%";
}
function setSrc(im, keepView){ src=im; base=Math.max(FW/im.width,FH/im.height); if(!keepView){ view={x:0,y:0,s:1}; $("zoom").value=1 } drawCrop() }
function openCrop(){
  src=null; pts=defaultPts(); view={x:0,y:0,s:1}; $("zoom").value=1; mouth={x:FW*.5,y:FH*.72};
  try{ const st=JSON.parse(store.get("faceState","null")); if(st){ pts=st.pts; view=st.view; mouth=st.mouth; $("zoom").value=view.s } }catch{}
  const sv=store.get("faceSrc"); if(sv){ const im=new Image(); im.onload=()=>setSrc(im,true); im.src=sv }
  mode="shape"; setTab(); drawCrop(); $("dlg").showModal();
}
$("faceFile").onchange = e => {
  const f=e.target.files[0]; if(!f) return; const im=new Image();
  im.onload=()=>{ setSrc(im); URL.revokeObjectURL(im.src) }; im.src=URL.createObjectURL(f);
};
$("zoom").oninput = e => { view.s=+e.target.value; drawCrop() };
function setTab(){ for(const [k,id] of [["shape","tabShape"],["move","tabMove"],["mouth","tabMouth"]]) $(id).classList.toggle("on", mode===k); drawCrop() }
$("tabShape").onclick=()=>{mode="shape";setTab()}; $("tabMove").onclick=()=>{mode="move";setTab()}; $("tabMouth").onclick=()=>{mode="mouth";setTab()};
let drag=null;
function cpos(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*FW, y:(e.clientY-r.top)/r.height*FH} }
function hitPt(q){ let b=-1,d=26; pts.forEach((p,i)=>{ const k=Math.hypot(p.x-q.x,p.y-q.y); if(k<d){d=k;b=i} }); return b }
cv.onpointerdown = e => {
  cv.setPointerCapture(e.pointerId); const q=cpos(e);
  if(mode==="mouth"){ mouth=q; drawCrop(); drag={mouth:1}; return }
  if(mode==="shape"){
    let i=hitPt(q);
    if(i<0){ let best=null,bd=22; samples().forEach(s=>{ const k=Math.hypot(s.x-q.x,s.y-q.y); if(k<bd){bd=k;best=s} });
      if(best){ pts.splice(best.i+1,0,{x:q.x,y:q.y}); i=best.i+1 } }
    if(i>=0){ drag={pt:i}; drawCrop(); return }
  }
  drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,all:mode==="shape"};
};
cv.onpointermove = e => {
  if(!drag) return; const q=cpos(e);
  if(drag.mouth){ mouth=q } else if(drag.pt!==undefined){ pts[drag.pt]={x:q.x,y:q.y} }
  else { const k=FW/cv.getBoundingClientRect().width; view.x=drag.vx+(e.clientX-drag.x)*k; view.y=drag.vy+(e.clientY-drag.y)*k }
  drawCrop();
};
cv.onpointerup = () => drag=null;
cv.ondblclick = e => { if(mode!=="shape"||pts.length<=6) return; const i=hitPt(cpos(e)); if(i>=0){ pts.splice(i,1); drawCrop() } };
cv.onwheel = e => { e.preventDefault(); view.s=Math.min(4,Math.max(.3,view.s*(e.deltaY<0?1.06:.94))); $("zoom").value=view.s; drawCrop() };
$("cancel").onclick = () => $("dlg").close();
$("save").onclick = () => {
  if(!src){ $("faceFile").click(); return }
  // 윤곽의 바운딩 박스로 잘라서 저장
  const S=samples(); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; S.forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y)});
  x0=Math.max(0,x0-4);y0=Math.max(0,y0-4);x1=Math.min(FW,x1+4);y1=Math.min(FH,y1+4);
  const w=x1-x0,h=y1-y0, out=document.createElement("canvas"); out.width=w; out.height=h; const o=out.getContext("2d");
  o.translate(-x0,-y0); tracePath(o); o.clip();
  const sc=base*view.s; o.drawImage(src, view.x-src.width*sc/2+FW/2, view.y-src.height*sc/2+FH/2, src.width*sc, src.height*sc);
  store.set("face", out.toDataURL("image/png"));
  store.set("mouth", JSON.stringify({x:Math.min(1,Math.max(0,(mouth.x-x0)/w)), y:Math.min(1,Math.max(0,(mouth.y-y0)/h))}));
  store.set("faceAr", (w/h).toFixed(4));
  // 원본(다시 편집용)
  const k=Math.min(1,1000/Math.max(src.width,src.height)), c=document.createElement("canvas"); c.width=src.width*k; c.height=src.height*k; c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  store.set("faceSrc", c.toDataURL("image/jpeg",.85));
  store.set("faceState", JSON.stringify({pts,view,mouth}));
  applyFace(); $("dlg").close();
};
function applyFace(){
  const f=store.get("face"); if(!f) return;
  $("faceImg").src=f; $("head").classList.remove("hide"); $("emptyHead").classList.add("hide");
  $("head").style.setProperty("--ar", store.get("faceAr","0.857"));
  const m=JSON.parse(store.get("mouth",'{"x":0.5,"y":0.7}'));
  $("mouth").style.left=m.x*100+"%"; $("mouth").style.top=m.y*100+"%";
  const im=new Image(); im.onload=()=>{ try{
    const c=document.createElement("canvas"); c.width=c.height=1; const g=c.getContext("2d");
    g.drawImage(im, im.width*.45, im.height*.55, 20, 20, 0,0,1,1);
    const [r,gr,b]=g.getImageData(0,0,1,1).data; $("neck").setAttribute("fill",`rgb(${r},${gr},${b})`) }catch{} }; im.src=f;
}
$("emptyHead").onclick = $("btnFace").onclick = openCrop;

/* ═════ 입 모양 (소리 없이 글자 수만큼 말하는 모션) ═════ */
let mouthTimer=null, talkEnd=null;
function mouthLoop(on){
  clearInterval(mouthTimer); const m=$("mouth"); m.className="mouth";
  $("tutor").classList.toggle("talking", on);
  if(on) mouthTimer=setInterval(()=>{ m.className="mouth m"+Math.floor(Math.random()*4) },120);
}
function speak(text){ clearTimeout(talkEnd); mouthLoop(true); talkEnd=setTimeout(()=>mouthLoop(false), Math.min(9000, text.length*70)) }

/* ═════ 말풍선 · 단계 진행 ═════ */
let steps = [], idx = 0, typing = null;
function say(text, talk=true){
  clearInterval(typing); const el=$("say"); el.textContent=""; let i=0;
  const chars=[...text];
  typing = setInterval(()=>{ el.textContent += chars[i++]??""; if(i>=chars.length) clearInterval(typing) }, 26);
  if(talk) speak(text);
}
function showStep(i){
  idx = Math.max(0, Math.min(steps.length-1, i));
  const s = steps[idx]; say(s.say);
  $("dots").textContent = `${idx+1} / ${steps.length}`;
  $("prev").disabled = idx===0; $("next").disabled = idx===steps.length-1; $("replay").disabled=false;
  const last = idx===steps.length-1;
  $("final").style.display = last && result.answer ? "block" : "none";
  $("followup").style.display = "flex";
}
$("next").onclick = () => showStep(idx+1);
$("prev").onclick = () => showStep(idx-1);
$("replay").onclick = () => steps[idx] && say(steps[idx].say);
document.addEventListener("keydown", e => { if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if(e.key==="ArrowRight") $("next").click(); if(e.key==="ArrowLeft") $("prev").click() });

/* ═════ 문제 입력 ═════ */
let probImg = null; // {media_type, data}
const drop = $("drop");
drop.onclick = () => $("probFile").click();
$("probFile").onchange = e => e.target.files[0] && loadProb(e.target.files[0]);
document.addEventListener("paste", e => { const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith("image/")); if(f) loadProb(f) });
drop.ondragover = e => e.preventDefault();
drop.ondrop = e => { e.preventDefault(); const f=e.dataTransfer.files[0]; f&&f.type.startsWith("image/")&&loadProb(f) };
function loadProb(file){
  const im = new Image();
  im.onload = () => {
    const k = Math.min(1, 1600/Math.max(im.width,im.height)), c=document.createElement("canvas");
    c.width=im.width*k; c.height=im.height*k; c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    const url = c.toDataURL("image/jpeg",.85);
    probImg = {media_type:"image/jpeg", data:url.split(",")[1]};
    drop.classList.add("has"); drop.innerHTML=""; const t=new Image(); t.src=url; drop.appendChild(t);
    URL.revokeObjectURL(im.src);
  };
  im.src = URL.createObjectURL(file);
}

/* ═════ Claude 분석 ═════ */
const MODEL = "claude-sonnet-5-5";
let history = [], result = {};
function systemPrompt(){
  return `너는 "${$("tname").value||"얼굴쌤"}"이라는 1:1 과외 선생님이다. 학생은 ${$("level").value}이고, 말투는 ${$("style").value}.
학생이 올린 문제(사진 또는 글)를 분석해 마주 앉아 설명하듯 가르쳐라.
반드시 아래 JSON 하나만 출력한다(코드블록·설명 금지):
{"subject":"과목/단원","summary":"문제가 묻는 것 한 줄","steps":[{"say":"선생님이 말하는 한두 문장, 필요하면 식도 글로 풀어서(입말, 이모지·마크다운 금지)"}],"answer":"최종 정답(한 줄)","tip":"자주 하는 실수나 비슷한 문제 팁 한 줄"}
규칙: steps는 4~8개. 첫 step은 문제를 같이 읽고 무엇을 구하는지 짚는다. 정답만 던지지 말고 왜 그렇게 되는지 이끌어라. 마지막 step은 검산 또는 확인 질문으로 끝낸다. 사진이 흐려 읽을 수 없으면 steps 하나로 다시 찍어달라고 말한다. 후속 질문에는 같은 JSON 형식으로 해당 부분만 다시 쉽게 설명한다.`;
}
async function ask(userContent){
  const key = $("apikey").value.trim();
  if(!key) throw new Error("오른쪽 아래 설정에 Claude API 키를 먼저 넣어주세요.");
  history.push({role:"user", content:userContent});
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body: JSON.stringify({model:MODEL, max_tokens:4000, system:systemPrompt(), messages:history})
  });
  if(!r.ok){ history.pop(); const t=await r.text(); throw new Error(r.status===401?"API 키가 올바르지 않아요.":`요청 실패 (${r.status}) ${t.slice(0,160)}`) }
  const j = await r.json();
  const text = j.content.filter(b=>b.type==="text").map(b=>b.text).join("");
  history.push({role:"assistant", content:text});
  return parse(text);
}
function parse(text){
  const m = text.match(/\{[\s\S]*\}/);
  try{ const o = JSON.parse(m?m[0]:text); if(Array.isArray(o.steps)&&o.steps.length) return o }catch{}
  const parts = text.split(/\n{2,}/).filter(Boolean);
  return {steps: parts.map(p=>({say:p.replace(/[*#`]/g,"")})), answer:"", tip:""};
}
function render(o){
  result = o; steps = o.steps.map(s=>({say:String(s.say||"")}));
  const f=$("final"); f.textContent="";
  const a=document.createElement("div"); const b=document.createElement("b"); b.textContent="정답 "; a.append(b, o.answer||""); f.appendChild(a);
  if(o.tip){ const t=document.createElement("div"); t.className="note"; t.textContent="팁 · "+o.tip; f.appendChild(t) }
  showStep(0);
}
async function run(content, label){
  $("err").textContent=""; $("go").disabled=true;
  $("tutor").classList.add("think"); say(label, false);
  try{ render(await ask(content)) }
  catch(e){ $("err").textContent = e.message; say("앗, 문제가 생겼어. 오른쪽 안내를 확인해줘.", false) }
  finally{ $("go").disabled=false; $("tutor").classList.remove("think") }
}
$("go").onclick = () => {
  const text = $("probText").value.trim();
  if(!text && !probImg){ $("err").textContent="문제 사진이나 글을 먼저 올려주세요."; return }
  history = [];
  const c = []; if(probImg) c.push({type:"image", source:{type:"base64", ...probImg}});
  c.push({type:"text", text: text || "사진 속 문제를 풀어서 가르쳐줘."});
  run(c, "음… 문제를 읽어볼게. 잠깐만 기다려줘");
};
$("followup").onsubmit = e => {
  e.preventDefault(); const q=$("fuText").value.trim(); if(!q) return; $("fuText").value="";
  run([{type:"text", text:"학생 질문: "+q}], "좋은 질문이야. 생각 좀 해볼게");
};

/* ═════ 설정 저장 ═════ */
for(const id of ["apikey","tname"]){ $(id).value = store.get(id, $(id).value); $(id).onchange = () => store.set(id, $(id).value) }
for(const id of ["level","style"]){ $(id).value = store.get(id, $(id).value); $(id).onchange = () => store.set(id, $(id).value) }
applyFace();
if(!store.get("face")) say("먼저 내 얼굴(?)을 만들어줘! 가운데 '얼굴'을 눌러서 사진을 오려 붙여봐.", false);
</script>
